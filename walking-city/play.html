<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/phone.css">
<script src="../shared/vendor/peerjs.min.js"></script>
</head>
<body class="phone wc">
  <header id="top" class="top hidden"></header>

  <!-- JOIN -->
  <section id="join" class="screen">
    <h1 class="logo" id="logo"></h1>
    <label class="muted">Room code</label>
    <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
    <label class="muted">Your name</label>
    <input id="nameIn" maxlength="12" autocomplete="nickname" placeholder="Name">
    <button id="joinBtn" class="btn gold wide">Join</button>
    <p id="joinMsg" class="muted center"></p>
  </section>

  <!-- PICK A DEPARTMENT / WAITING / WATCHING / OVER -->
  <section id="wait" class="screen hidden"></section>

  <!-- PLAN -->
  <section id="plan" class="screen hidden">
    <div id="asks" class="asks"></div>
    <div id="gridBox" class="grid-box"></div>
    <div id="sheet" class="sheet"></div>
    <div id="role" class="role"></div>
    <div class="bottom">
      <button id="autoBtn" class="btn secondary">Autopilot</button>
      <button id="readyBtn" class="btn gold">Ready</button>
    </div>
  </section>

  <!-- LOCKED IN -->
  <section id="locked" class="screen hidden"></section>

  <div id="toast" class="toast hidden"></div>
<script type="module" src="js/ui/phone.js"></script>
</body>
</html>
