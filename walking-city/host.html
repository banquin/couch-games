<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Walking City · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/host.css">
<script src="../shared/vendor/peerjs.min.js"></script>
<script src="../shared/vendor/qrcode.js"></script>
</head>
<body class="host wc">
  <!-- LOBBY -->
  <section id="lobby" class="screen">
    <div class="lobby-left">
      <a class="back" href="../index.html">‹ All games</a>
      <h1 class="logo big" id="logo"></h1>
      <p class="tagline" id="tagline"></p>
      <div class="join-box hud">
        <div id="qr" class="qr"></div>
        <div>
          <div class="muted">Join on your phone, then pick a department</div>
          <div id="joinUrl" class="join-url"></div>
          <div class="muted" style="margin-top:14px">Room code</div>
          <div id="roomCode" class="room-code">····</div>
        </div>
      </div>
      <div id="netNote" class="net-note muted"></div>
    </div>
    <div class="lobby-right">
      <h2 class="title">Departments <span class="muted small-note">bots run any seat nobody takes</span></h2>
      <div id="slots" class="slots"></div>
      <div class="pickers">
        <div class="picker"><span>Difficulty</span>
          <button class="chip" data-mode="first">First Voyage</button>
          <button class="chip" data-mode="standard">Standard</button>
          <button class="chip" data-mode="gale">Gale</button></div>
      </div>
      <div class="lobby-actions">
        <button id="startBtn" class="btn gold">Start</button>
      </div>
      <details class="howto hud">
        <summary>How to play (30 seconds)</summary>
        <ol id="howto"></ol>
      </details>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen hidden">
    <div class="track-wrap"><svg id="track" viewBox="0 0 200 1000" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="board">
      <div class="dept-panel" id="p-power"></div>
      <div class="dept-panel" id="p-fab"></div>
      <div class="dept-panel" id="p-loco"></div>
      <div class="dept-panel" id="p-shield"></div>
      <div class="center" id="center"></div>
      <div class="dept-panel" id="p-research"></div>
    </div>
    <footer class="foot">
      <div id="footLine" class="foot-line"></div>
      <span id="footCode" class="muted"></span>
      <button id="pauseBtn" class="btn secondary tiny">Pause</button>
      <button id="newBtn" class="btn secondary tiny">New game</button>
    </footer>
    <div id="banner" class="banner hidden"></div>
  </section>

  <!-- GAME OVER -->
  <section id="over" class="screen hidden">
    <div id="overBox" class="over-box"></div>
    <div class="lobby-actions center"><button id="againBtn" class="btn gold">Play again</button><a class="btn secondary" href="../index.html">Pick another game</a></div>
  </section>

<script type="module" src="js/ui/host.js"></script>
</body>
</html>
